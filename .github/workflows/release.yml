name: Release

# Fires when a version tag is pushed (e.g. created via the GitHub web UI when
# publishing a release, or `git push origin v1.4.0`). tauri-action then builds
# each OS in parallel and attaches the installers to a DRAFT GitHub release for
# that tag, which you finalize (write notes) and publish yourself.
on:
  push:
    tags:
      - 'v*'

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal DMG that runs on both Apple Silicon (arm64) and Intel (x64).
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux Tauri/WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS arches are needed to link a universal-apple-darwin binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # tauri-action invokes the tauri CLI directly and does NOT run the `pretauri`
      # npm hook, so the version sync must be an explicit step (mirrors CI).
      - name: Sync version metadata
        run: npm run update-version

      # Tauri v1 bundles AppImages with an old linuxdeploy whose AppImage plugin
      # embeds the legacy runtime, which needs libfuse2 (absent by default on
      # Ubuntu 22.04+ etc.). linuxdeploy prefers a plugin AppImage placed next to
      # it in Tauri's tools cache, so drop in a plugin built on the new
      # appimagetool, which embeds the static type2-runtime (no libfuse2 needed).
      - name: Use AppImage plugin with the static (libfuse2-free) runtime
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          wget -q -O ~/.cache/tauri/linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-appimage-x86_64.AppImage

      # linuxdeploy-plugin-gtk forces `GDK_BACKEND=x11` in the AppImage runtime hook,
      # which makes the UI tiny on HiDPI Wayland compositors. Apply the same patch
      # as build_dist.sh (prefer Wayland; ZLACK_GDK_BACKEND=x11 forces X11), with a
      # far-future mtime so the bundler's `wget -N` keeps the patched copy.
      - name: Patch GTK plugin to prefer Wayland (HiDPI)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          GTK_PLUGIN_PATH=~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          wget -q -O "$GTK_PLUGIN_PATH" https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x "$GTK_PLUGIN_PATH"
          sed -i 's/^export GDK_BACKEND=x11.*/export GDK_BACKEND="${ZLACK_GDK_BACKEND:-wayland,x11}" # Prefer Wayland; set ZLACK_GDK_BACKEND=x11 to force X11/' "$GTK_PLUGIN_PATH"
          grep -q 'ZLACK_GDK_BACKEND' "$GTK_PLUGIN_PATH"
          touch -d '2038-01-01 00:00:00' "$GTK_PLUGIN_PATH"

      - name: Build and publish to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Disable strip during AppImage bundling to avoid linuxdeploy failing on
          # shared libs with RELR (`.relr.dyn`) relocations (mirrors build_dist.sh).
          NO_STRIP: 'true'
          # Let the plugin AppImage run on runners without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zlack ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
