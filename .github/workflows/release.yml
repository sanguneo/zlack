name: Release

# Fires when a version tag is pushed (e.g. created via the GitHub web UI when
# publishing a release, or `git push origin v1.4.0`). tauri-action then builds
# each OS in parallel and attaches the installers to a DRAFT GitHub release for
# that tag, which you finalize (write notes) and publish yourself.
on:
  push:
    tags:
      - 'v*'

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal DMG that runs on both Apple Silicon (arm64) and Intel (x64).
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux Tauri/WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      # Pinned to 1.92 for the same reason CI is: Rust 1.93+ changed glob-import
      # trait scoping, which breaks wry 0.24.11's `use webkit2gtk::{traits::*}` on
      # the Linux (webkit2gtk) path used by Tauri v1. Unpin after a Tauri v2 upgrade.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.92
        with:
          # Both macOS arches are needed to link a universal-apple-darwin binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # tauri-action invokes the tauri CLI directly and does NOT run the `pretauri`
      # npm hook, so the version sync must be an explicit step (mirrors CI).
      - name: Sync version metadata
        run: npm run update-version

      - name: Build and publish to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Disable strip during AppImage bundling to avoid linuxdeploy failing on
          # shared libs with RELR (`.relr.dyn`) relocations (mirrors build_dist.sh).
          NO_STRIP: 'true'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zlack ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
